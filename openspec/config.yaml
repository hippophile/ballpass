schema: spec-driven

context: |
  Ballpass investor POC: athlete scouting (women's basketball first, Greece).
  Stack: .NET 10 Blazor Web App, static SSR (no interactive circuits), EF Core + PostgreSQL 18.
  Config only via appsettings.json / user-secrets / env vars. No secrets in git.
  MVP items (every scenario must trace to one): M0 skeleton, M1 athlete profile, M2 coach search,
  M3 express interest, M4 shortlist, M5 demo login, M6 Greek/English.
  IN SCOPE since 2026-11-21 (founder decision: "LinkedIn for athletes", "one very good MVP, not multiple"): feed with
  structured + free-text posts, one reaction type, safeguards (adults only, report button, no DMs; comments since 2026-11-22, see below),
  follows, ONE polished dark theme (no theme variants), shareable player cards, stats charts, fit scores.
  Since 2026-11-22 ("alive feed"): self-hosted stock photos/videos WITHOUT recognisable faces (logged in docs/ASSETS.md),
  comments with safeguards (adults only, rate limit, delete/hide/report, no replies-to-replies), public kudos counts,
  stories bar, jersey avatars, who-to-follow, trending tags.
  OUT OF SCOPE (reject in review): chat/DMs, payments, user uploads of photos/video files, recognisable faces in any media, Trust Score with negative
  points, computer vision on real video, ESKA/EOK/Mismatch endorsement claims, anything involving minors.
  Demo data is fictional only: every seeded row is flagged demo, every page shows the demo banner,
  no real people, no minors (under 18) in search results.

rules:
  proposal:
    - State the MVP item id(s) the change serves
    - Measured blast radius with real counts and a date
  tasks:
    - "Test-first: an early task writes failing tests and records the red run"
